name: Update Steam recent games
on:
  workflow_dispatch:
  push:
    paths:
      - 'gaming/update.py'
      - '.github/workflows/steam-recent.yml'
  schedule:
    - cron: '16 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch recently played games
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          if [ -z "$STEAM_API_KEY" ]; then
            echo "STEAM_API_KEY is not configured. No data will be published."
            exit 0
          fi
          python3 gaming/update.py
      - name: Commit updated game data
        run: |
          if [ ! -f data/steam-recent.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam-recent.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Steam recently played games"
          git push
