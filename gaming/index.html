<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fbfc;color:#172033;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 12px 55px}h1{font-size:2rem;margin:0}p{color:#5b6475;line-height:1.6}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.game{border:1px solid #dce5ed;background:white;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #1720330b}.game img{width:100%;aspect-ratio:460/215;object-fit:cover;background:#172033}.game div{padding:14px}.game h2{font-size:1rem;margin:0 0 9px}.game p{font-size:.9rem;margin:3px 0}.notice{padding:20px;border:1px solid #b9ded9;background:#e8f7f4;border-radius:16px}a{color:#147b75}</style></head><body><main><h1>🎮 Nylig spilt</h1><p>Hva har jeg kastet bort tid på i det siste? Spilltid hentes fra Steam når den private API-nøkkelen er konfigurert.</p><div id="games" class="games"><div class="notice">Laster spill ...</div></div><p><a href="https://steamcommunity.com/profiles/76561198030319279/" target="_blank" rel="noopener">Åpne Steam-profilen ↗</a></p></main><script>
const root=document.getElementById('games');
const steamId='76561198030319279';
(async()=>{try{const response=await fetch('../data/steam-recent.json?'+Date.now());if(!response.ok)throw Error('Data er ikke satt opp ennå');const data=await response.json();if(!data.games?.length)throw Error('Ingen nylig spilte spill tilgjengelig');root.replaceChildren();data.games.forEach(game=>{const card=document.createElement('article');card.className='game';const image=document.createElement('img');image.src='https://cdn.cloudflare.steamstatic.com/steam/apps/'+encodeURIComponent(game.appid)+'/header.jpg';image.alt=game.name;image.loading='lazy';const details=document.createElement('div'),title=document.createElement('h2');title.textContent=game.name;details.append(title);for(const [label,value] of [['Siste to uker',game.playtime_2weeks],['Totalt',game.playtime_forever]]){const p=document.createElement('p');p.textContent=label+': '+Math.round((value||0)/6)/10+' timer';details.append(p)}card.append(image,details);root.append(card)})}catch(e){root.innerHTML='<div class="notice"><strong>Steam-koblingen er ikke aktiv ennå.</strong><p>For å vise de nylig spilte spillene må du legge til GitHub Actions-hemmeligheten <code>STEAM_API_KEY</code>. Arbeidsflyten vil deretter hente spillene automatisk.</p><a href="https://steamcommunity.com/profiles/'+steamId+'/" target="_blank" rel="noopener">Steam-profil ↗</a></div>'}})();
const sendHeight=()=>window.parent.postMessage({type:'gaming-resize',height:document.documentElement.scrollHeight},location.origin);new ResizeObserver(sendHeight).observe(document.body);window.addEventListener('load',sendHeight);</script></body></html>
