<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fbfc;color:#172033;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 12px 55px}h1{font-size:2rem;margin:0}h2{margin:28px 0 12px}p{color:#5b6475;line-height:1.6}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.game{border:1px solid #dce5ed;background:white;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #1720330b}.game img{width:100%;aspect-ratio:460/215;object-fit:cover;background:#172033}.game div{padding:14px}.game h3{font-size:1rem;margin:0 0 9px}.game p{font-size:.9rem;margin:3px 0}.notice{padding:20px;border:1px solid #b9ded9;background:#e8f7f4;border-radius:16px}.achievement{padding:12px 0;border-bottom:1px solid #dce5ed}.achievement:last-child{border:0}a{color:#147b75}</style></head><body><main><h1>Gaming</h1><p>Spill jeg har spilt i det siste, favoritter og de mest spilte gjennom tidene.</p><section><h2>Noen favoritter</h2><div id="favorites" class="games"><div class="notice">Laster …</div></div></section><section><h2>Mest spilt gjennom tidene</h2><div id="all-time" class="games"><div class="notice">Laster …</div></div></section><section><h2>Nylig spilt</h2><div id="games" class="games"><div class="notice">Laster …</div></div></section><section><h2>Siste achievements</h2><div id="achievements"><div class="notice">Laster …</div></div></section><p><a href="https://steamcommunity.com/profiles/76561198030319279/" target="_blank" rel="noopener">Åpne Steam-profilen</a></p></main><script>
const make=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};const hours=m=>Math.round((m||0)/6)/10+' timer';
function cards(id,games,period){const root=document.getElementById(id);root.replaceChildren();if(!games?.length){root.append(make('div','Ingen spilldata tilgjengelig.','notice'));return}games.forEach(g=>{const card=make('article','','game'),img=document.createElement('img');img.src='https://cdn.cloudflare.steamstatic.com/steam/apps/'+encodeURIComponent(g.appid)+'/header.jpg';img.alt='';img.loading='lazy';const details=document.createElement('div'),title=make('h3',g.name),time=make('p',period==='recent'?'Siste to uker: '+hours(g.playtime_2weeks):'Totalt: '+hours(g.playtime_forever)),link=document.createElement('a');link.href='https://store.steampowered.com/app/'+encodeURIComponent(g.appid)+'/';link.target='_blank';link.rel='noopener noreferrer';link.append(title);details.append(link,time);card.append(img,details);root.append(card)})}
(async()=>{try{const response=await fetch('../data/steam-recent.json?'+Date.now());if(!response.ok)throw Error();const data=await response.json();cards('games',data.games,'recent');cards('all-time',data.all_time,'all');cards('favorites',data.favorites,'all');const root=document.getElementById('achievements');root.replaceChildren();if(!data.achievements?.length)root.append(make('p','Ingen offentlige achievements tilgjengelige ennå.'));else data.achievements.forEach(a=>{const row=make('div','','achievement');row.append(make('strong',a.name),make('p',a.game+' · '+new Date(a.unlocktime*1000).toLocaleDateString('no-NO')));root.append(row)})}catch{for(const id of ['games','all-time','favorites','achievements']){const root=document.getElementById(id);root.replaceChildren(make('div','Steam-data er ikke tilgjengelige ennå. Oppdateringen trenger STEAM_API_KEY i GitHub Actions.','notice'))}}})();const sendHeight=()=>window.parent.postMessage({type:'gaming-resize',height:document.documentElement.scrollHeight},location.origin);new ResizeObserver(sendHeight).observe(document.body);window.addEventListener('load',sendHeight);
</script></body></html>
